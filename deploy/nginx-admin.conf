# Nginx для адмінки app.pika-leads.com
# Скопіювати в /etc/nginx/sites-available/pikaleads-admin, увімкнути симлінком у sites-enabled,
# перевірити `nginx -t`, перезавантажити `systemctl reload nginx`.
# HTTPS додає certbot: `certbot --nginx -d app.pika-leads.com`

server {
    listen 80;
    server_name app.pika-leads.com;

    root /var/www/pikaleads-admin;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API адмінки → приймач заявок (server/leads, сервіс pikaleads-leads)
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        # лише реальна IP-адреса клієнта — для захисту від перебору паролів
        proxy_set_header X-Forwarded-For $remote_addr;
        # збереження кейсів/статей разом із картинками
        client_max_body_size 40m;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # інші /api/* тут не потрібні
    location /api/ {
        return 404;
    }

    # файли з хешем у назві — довгий кеш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: /leads, /team, /profile… → index.html, без кешу
    # (add_header у location скасовує заголовки рівня server, тому всі тут)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.fbcdn.net; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
