# Nginx для pikaleads (SPA на React/Vite).
# Скопіювати в /etc/nginx/sites-available/pikaleads, увімкнути симлінком
# у sites-enabled, перевірити `nginx -t`, перезавантажити `systemctl reload nginx`.
# HTTPS додає certbot: `certbot --nginx -d pika-leads.com -d www.pika-leads.com`.

# www → без www
server {
    listen 80;
    server_name www.pika-leads.com;
    return 301 https://pika-leads.com$request_uri;
}

server {
    listen 80;
    server_name pika-leads.com;

    root /var/www/pikaleads;
    index index.html;

    # стиснення
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # файли з хешем у назві — кешуємо назавжди
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кешуємо, щоб після деплою одразу підтягувалась нова версія
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # приймач заявок (server/leads, systemd-сервіс pikaleads-leads)
    location /api/leads {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    # короткі посилання з UTM-конструктора адмінки: /go/<код> → 302 на сторінку з мітками
    location /go/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header X-Robots-Tag "noindex" always;
    }

    # сторінки: пререндерений /en/cases/index.html віддаємо напряму (без 301 на «/»),
    # інші файли — як є, невідомі адреси — index.html (React-роутер)
    # HTML не кешуємо, щоб після деплою одразу підтягувалась нова версія.
    # add_header у location скасовує заголовки з server, тому безпекові дублюємо тут.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri/index.html $uri /index.html;
    }

    # базові заголовки безпеки
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
