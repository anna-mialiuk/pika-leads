# Автодеплой: кожен push у main → збірка → копіювання dist/ на VPS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_LEADS_ENDPOINT: ${{ secrets.LEADS_ENDPOINT }}

      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # приймач заявок: код у /home/deploy/leads-server (.env і файли заявок не чіпаємо)
      - name: Update leads server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --exclude ".env" --exclude "*.jsonl" \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/leads/ "$SSH_USER@$SSH_HOST:/home/deploy/leads-server/"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "sudo systemctl restart pikaleads-leads"
