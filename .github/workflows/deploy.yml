# Автодеплой: кожен push у main →
#   1) сайт (npm run build → dist/)            → /var/www/pikaleads
#   2) адмінка (admin/ → admin/dist/)          → /var/www/pikaleads-admin  (app.pika-leads.com)
#   3) приймач заявок + API адмінки (server/leads) → /home/deploy/leads-server і перезапуск сервісу
# Налаштування: Settings → Secrets and variables → Actions (див. DEPLOY.md)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # ручний запуск з вкладки Actions

# запуски йдуть по черзі (кілька збережень в адмінці поспіль не переривають один одного)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      # ---------- сайт ----------
      - run: npm ci

      # i18n-перевірка + sitemap + збірка + пререндер
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_LEADS_ENDPOINT: ${{ secrets.LEADS_ENDPOINT }}

      # ---------- адмінка ----------
      - name: Build admin
        working-directory: admin
        run: |
          npm ci
          npm run build

      # ---------- копіювання на сервер ----------
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # старі assets/* не видаляємо одразу: у відкритих вкладках сторінки ще
          # підвантажують їх; прибираємо ті, що старші за 7 днів
          rsync -az --delete --exclude "/assets/" \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/assets/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/assets/"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "find '$DEPLOY_PATH/assets' -type f -mtime +7 -delete"

      - name: Upload admin
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            admin/dist/ "$SSH_USER@$SSH_HOST:/var/www/pikaleads-admin/"

      # код приймача; дані на сервері (.env, заявки, користувачі, ключ) не чіпаємо
      - name: Update leads server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # -c: порівняння за вмістом (без -t час файлів не важливий) — вивід лише для змінених
          CHANGED=$(rsync -rlzci \
            --exclude ".env" --exclude "*.json" --exclude "*.jsonl" \
            --exclude "*.key" --exclude "*.tmp" --exclude "*.broken-*" \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/leads/ "$SSH_USER@$SSH_HOST:/home/deploy/leads-server/")
          # перезапуск лише якщо змінився код (збереження контенту з адмінки його не чіпає)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "sudo systemctl restart pikaleads-leads"
          else
            echo "Код приймача не змінився — без перезапуску"
          fi
